[project]
name = "crossroads-app"
version = "0.1.0"
description = "Fetches calendars and mail for the Crossroads Omarchy shell plugin"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "icalendar",
    "recurring-ical-events",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "pytest-bdd",
]

[project.scripts]
crossroads = "crossroads.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

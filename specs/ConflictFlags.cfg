SPECIFICATION Spec

\* One calendar per tag is enough: same-tag overlaps happen within a calendar.
\* Three ids and three events cover one event overlapping two others,
\* and one event copied onto both calendars next to a third.
\* Time 0..2 gives touching intervals [0,1) and [1,2).
\* Accepted behaves like tentative and cancelled like declined, so one of
\* each pair is enough; the other two cost a lot of states and add nothing.
CONSTANTS
    Ids = {e1, e2, e3}
    PersonalCals = {p1}
    WorkCals = {w1}
    MaxTime = 2
    MaxEvents = 3
    ModelStatuses = {"tentative", "declined"}

INVARIANTS
    TypeOK
    AllDayNeverFlagged
    InactiveNeverFlagged
    OverlapsAreFlagged
    FlagsNeedRealOverlap
    CrossTagShowsMixed
    MixedNeedsCrossTag
    CardsAreRealOverlaps
    OneCardPerOverlap
    CardWindowIsTheOverlap

PROPERTIES
    ViewCatchesUp

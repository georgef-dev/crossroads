SPECIFICATION Spec

\* Two of each is enough: one setting or calendar changes while the other
\* must survive. Four changes cover retagging the same calendar, a crash,
\* and a change after the crash.
CONSTANTS
    Keys = {k1, k2}
    Values = {v1, v2}
    Cals = {c1, c2}
    MaxChanges = 4
    NONE = NONE
    CORRUPT = CORRUPT

INVARIANTS
    TypeOK
    OtherSettingsSurvive
    ConfigIsAlwaysWhole
    OneTagPerCalendar
    TagIsApplied
    OtherCalendarsSurvive
